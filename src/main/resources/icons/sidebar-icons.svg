<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" style="background:#f4ede2; font-family:'Space Grotesk', 'JetBrains Mono', monospace;">
  <defs>
    <!-- Hard neo-brutalist drop shadow -->
    <filter id="chisel-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#1a1a1a" />
    </filter>
    <filter id="badge-drop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#1a1a1a" />
    </filter>
  </defs>

  <!-- Title / Spec Header -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="8" height="24" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2"/>
    <text x="18" y="18" font-size="15" font-weight="900" fill="#1a1a1a" letter-spacing="2">D&amp;D 2024 NAVIGATION // TACTILE BORDERED ICON SUITE</text>
    <text x="690" y="18" font-size="12" font-weight="700" fill="#595959" letter-spacing="1">PRIMARY APP MODULES // 5 ICONS</text>
    <line x1="0" y1="32" x2="920" y2="32" stroke="#1a1a1a" stroke-width="2"/>
  </g>

  <!-- ================= 5 MAIN APP NAVIGATION TILES ================= -->

  <!-- 1. CAST & COMBAT -->
  <g transform="translate(40, 85)">
    <!-- Outer Card Tile -->
    <rect x="0" y="0" width="168" height="230" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <!-- Yellow top bar -->
    <rect x="0" y="0" width="168" height="28" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="84" y="19" font-size="11" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">CAST &amp; COMBAT</text>

    <!-- ENCLOSED BORDERED ICON KEYCAP (64x64 recessed tactile frame with solid black border) -->
    <g transform="translate(52, 46)">
      <!-- Outer hard border with tactile bevel -->
      <rect x="0" y="0" width="64" height="64" rx="4" fill="#eae2d5" stroke="#1a1a1a" stroke-width="2.5" filter="url(#badge-drop)"/>
      <rect x="2" y="2" width="60" height="60" rx="2" fill="#fdfbf7" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Inner hairline dashed border -->
      <rect x="4" y="4" width="56" height="56" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2 1" opacity="0.4"/>
      <!-- Corner geometric rivets/notches -->
      <rect x="2" y="2" width="3" height="3" fill="#1a1a1a"/>
      <rect x="59" y="2" width="3" height="3" fill="#1a1a1a"/>
      <rect x="2" y="59" width="3" height="3" fill="#1a1a1a"/>
      <rect x="59" y="59" width="3" height="3" fill="#1a1a1a"/>

      <!-- Glyph: High-voltage arcane lightning bolt + crosshair spark -->
      <g transform="translate(32, 32) scale(0.68)">
        <!-- Dynamic jagged lightning strike in Bauhaus cadmium yellow ochre -->
        <polygon points="5,-32 -18,2 -2,2 -8,32 20,-2 2,-2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
        <!-- Crossed combat sparks / strike velocity lines in vermillion -->
        <line x1="-22" y1="-14" x2="-10" y2="-14" stroke="#dc2626" stroke-width="3" stroke-linecap="square"/>
        <line x1="10" y1="14" x2="22" y2="14" stroke="#dc2626" stroke-width="3" stroke-linecap="square"/>
        <circle cx="-16" cy="16" r="3" fill="#1a1a1a"/>
        <circle cx="16" cy="-16" r="3" fill="#2563eb"/>
      </g>
    </g>

    <text x="84" y="136" font-size="11" font-weight="800" fill="#1a1a1a" text-anchor="middle">SPELL EXECUTION</text>
    <text x="84" y="152" font-size="9" font-weight="700" fill="#595959" text-anchor="middle">ACTION ECONOMY</text>
    <text x="84" y="166" font-size="9" font-weight="700" fill="#595959" text-anchor="middle">DICE &amp; DAMAGE</text>

    <!-- Status / Module Tag -->
    <rect x="36" y="190" width="96" height="22" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="84" y="205" font-size="10" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">PRIMARY HUB</text>
  </g>

  <!-- 2. METAMAGIC -->
  <g transform="translate(228, 85)">
    <rect x="0" y="0" width="168" height="230" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="168" height="28" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="84" y="19" font-size="11" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">METAMAGIC</text>

    <!-- ENCLOSED BORDERED ICON KEYCAP -->
    <g transform="translate(52, 46)">
      <rect x="0" y="0" width="64" height="64" rx="4" fill="#eae2d5" stroke="#1a1a1a" stroke-width="2.5" filter="url(#badge-drop)"/>
      <rect x="2" y="2" width="60" height="60" rx="2" fill="#fdfbf7" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="4" y="4" width="56" height="56" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2 1" opacity="0.4"/>
      <rect x="2" y="2" width="3" height="3" fill="#1a1a1a"/>
      <rect x="59" y="2" width="3" height="3" fill="#1a1a1a"/>
      <rect x="2" y="59" width="3" height="3" fill="#1a1a1a"/>
      <rect x="59" y="59" width="3" height="3" fill="#1a1a1a"/>

      <!-- Glyph: Geometric 4-pointed arcane spark / weave flare with orbital nodes -->
      <g transform="translate(32, 32) scale(0.68)">
        <!-- 4-pointed Bauhaus diamond burst -->
        <path d="M 0,-30 Q 3,-10 24,0 Q 3,10 0,30 Q -3,10 -24,0 Q -3,-10 0,-30 Z" fill="#2563eb" stroke="#1a1a1a" stroke-width="3"/>
        <path d="M 0,-18 Q 2,-6 14,0 Q 2,6 0,18 Q -2,6 -14,0 Q -2,-6 0,-18 Z" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2"/>
        <circle cx="0" cy="0" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
        <!-- Corner satellite sparks -->
        <circle cx="-16" cy="-16" r="3" fill="#dc2626"/>
        <circle cx="16" cy="16" r="3" fill="#dc2626"/>
      </g>
    </g>

    <text x="84" y="136" font-size="11" font-weight="800" fill="#1a1a1a" text-anchor="middle">SORCERY POINTS</text>
    <text x="84" y="152" font-size="9" font-weight="700" fill="#595959" text-anchor="middle">10 WEAVE OPTIONS</text>
    <text x="84" y="166" font-size="9" font-weight="700" fill="#595959" text-anchor="middle">FLEXIBLE CASTING</text>

    <rect x="36" y="190" width="96" height="22" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="84" y="205" font-size="10" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">4/4 SP ACTIVE</text>
  </g>

  <!-- 3. FEATS & TRAITS -->
  <g transform="translate(416, 85)">
    <rect x="0" y="0" width="168" height="230" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="168" height="28" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="84" y="19" font-size="11" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">FEATS &amp; TRAITS</text>

    <!-- ENCLOSED BORDERED ICON KEYCAP -->
    <g transform="translate(52, 46)">
      <rect x="0" y="0" width="64" height="64" rx="4" fill="#eae2d5" stroke="#1a1a1a" stroke-width="2.5" filter="url(#badge-drop)"/>
      <rect x="2" y="2" width="60" height="60" rx="2" fill="#fdfbf7" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="4" y="4" width="56" height="56" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2 1" opacity="0.4"/>
      <rect x="2" y="2" width="3" height="3" fill="#1a1a1a"/>
      <rect x="59" y="2" width="3" height="3" fill="#1a1a1a"/>
      <rect x="2" y="59" width="3" height="3" fill="#1a1a1a"/>
      <rect x="59" y="59" width="3" height="3" fill="#1a1a1a"/>

      <!-- Glyph: Bauhaus geometric Aegis Shield + chevron emblem -->
      <g transform="translate(32, 32) scale(0.68)">
        <!-- Hard faceted shield outline -->
        <path d="M 0,-30 L 26,-14 L 26,10 C 26,24 0,34 0,34 C 0,34 -26,24 -26,10 L -26,-14 Z" fill="#eae2d5" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
        <!-- Inset contrast half-panel (Bauhaus dual-tone) -->
        <path d="M 0,-28 L 24,-13 L 24,9 C 24,22 0,31 0,31 Z" fill="#dc2626" opacity="0.95"/>
        <path d="M 0,-28 L -24,-13 L -24,9 C -24,22 0,31 0,31 Z" fill="#fbbf24"/>
        <line x1="0" y1="-28" x2="0" y2="31" stroke="#1a1a1a" stroke-width="2"/>
        <!-- Center star / proficiency notch -->
        <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
      </g>
    </g>

    <text x="84" y="136" font-size="11" font-weight="800" fill="#1a1a1a" text-anchor="middle">TRAITS &amp; POWERS</text>
    <text x="84" y="152" font-size="9" font-weight="700" fill="#595959" text-anchor="middle">WAR CASTER // ALERT</text>
    <text x="84" y="166" font-size="9" font-weight="700" fill="#595959" text-anchor="middle">SPECIES &amp; ORIGINS</text>

    <rect x="36" y="190" width="96" height="22" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="84" y="205" font-size="10" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">COMPENDIUM</text>
  </g>

  <!-- 4. SPELL LIBRARY -->
  <g transform="translate(604, 85)">
    <rect x="0" y="0" width="168" height="230" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="168" height="28" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="84" y="19" font-size="11" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">SPELL LIBRARY</text>

    <!-- ENCLOSED BORDERED ICON KEYCAP -->
    <g transform="translate(52, 46)">
      <rect x="0" y="0" width="64" height="64" rx="4" fill="#eae2d5" stroke="#1a1a1a" stroke-width="2.5" filter="url(#badge-drop)"/>
      <rect x="2" y="2" width="60" height="60" rx="2" fill="#fdfbf7" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="4" y="4" width="56" height="56" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2 1" opacity="0.4"/>
      <rect x="2" y="2" width="3" height="3" fill="#1a1a1a"/>
      <rect x="59" y="2" width="3" height="3" fill="#1a1a1a"/>
      <rect x="2" y="59" width="3" height="3" fill="#1a1a1a"/>
      <rect x="59" y="59" width="3" height="3" fill="#1a1a1a"/>

      <!-- Glyph: Industrial Grimoire Tome / Open spellbook with geometric bookmark ribbon -->
      <g transform="translate(32, 32) scale(0.68)">
        <!-- 3 Books in vertical stack or Open Tome -->
        <rect x="-24" y="-22" width="10" height="44" rx="1" fill="#2563eb" stroke="#1a1a1a" stroke-width="2.5"/>
        <line x1="-24" y1="-10" x2="-14" y2="-10" stroke="#ffffff" stroke-width="2"/>
        <line x1="-24" y1="12" x2="-14" y2="12" stroke="#ffffff" stroke-width="2"/>

        <rect x="-10" y="-26" width="12" height="48" rx="1" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2.5"/>
        <circle cx="-4" cy="-14" r="2.5" fill="#1a1a1a"/>
        <line x1="-10" y1="14" x2="2" y2="14" stroke="#1a1a1a" stroke-width="2"/>

        <!-- Tilted leaning third volume -->
        <g transform="translate(10, 0) rotate(16)">
          <rect x="-6" y="-24" width="12" height="46" rx="1" fill="#dc2626" stroke="#1a1a1a" stroke-width="2.5"/>
          <line x1="-6" y1="-8" x2="6" y2="-8" stroke="#ffffff" stroke-width="2"/>
          <line x1="-6" y1="10" x2="6" y2="10" stroke="#ffffff" stroke-width="2"/>
        </g>
      </g>
    </g>

    <text x="84" y="136" font-size="11" font-weight="800" fill="#1a1a1a" text-anchor="middle">SPELL CATALOG</text>
    <text x="84" y="152" font-size="9" font-weight="700" fill="#595959" text-anchor="middle">158 SRD SPELLS</text>
    <text x="84" y="166" font-size="9" font-weight="700" fill="#595959" text-anchor="middle">PREPARATION DESK</text>

    <rect x="36" y="190" width="96" height="22" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="84" y="205" font-size="10" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">FULL ARCHIVE</text>
  </g>

  <!-- 5. CHARACTER & SHEET -->
  <g transform="translate(792, 85)">
    <rect x="0" y="0" width="168" height="230" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="168" height="28" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="84" y="19" font-size="11" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">CHARACTER</text>

    <!-- ENCLOSED BORDERED ICON KEYCAP -->
    <g transform="translate(52, 46)">
      <rect x="0" y="0" width="64" height="64" rx="4" fill="#eae2d5" stroke="#1a1a1a" stroke-width="2.5" filter="url(#badge-drop)"/>
      <rect x="2" y="2" width="60" height="60" rx="2" fill="#fdfbf7" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="4" y="4" width="56" height="56" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2 1" opacity="0.4"/>
      <rect x="2" y="2" width="3" height="3" fill="#1a1a1a"/>
      <rect x="59" y="2" width="3" height="3" fill="#1a1a1a"/>
      <rect x="2" y="59" width="3" height="3" fill="#1a1a1a"/>
      <rect x="59" y="59" width="3" height="3" fill="#1a1a1a"/>

      <!-- Glyph: Bauhaus Sorcerer Bust / Geometric Silhouette + Psionic Core -->
      <g transform="translate(32, 32) scale(0.68)">
        <!-- Head orb / psionic circlet -->
        <circle cx="0" cy="-14" r="12" fill="#eae2d5" stroke="#1a1a1a" stroke-width="3"/>
        <circle cx="0" cy="-14" r="4" fill="#2563eb"/>
        <!-- Torso / Mantle shoulders with crisp industrial contours -->
        <path d="M -24,24 C -24,8 -14,2 0,2 C 14,2 24,8 24,24 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.5"/>
        <!-- Sorcerer mantle collar in yellow ochre -->
        <polygon points="0,2 -10,14 10,14" fill="#f59e0b" stroke="#1a1a1a" stroke-width="1.5"/>
        <!-- Badge alert notch / Aberrant psionic spark -->
        <circle cx="16" cy="-22" r="3" fill="#dc2626"/>
      </g>
    </g>

    <text x="84" y="136" font-size="11" font-weight="800" fill="#1a1a1a" text-anchor="middle">STATS &amp; LEVEL</text>
    <text x="84" y="152" font-size="9" font-weight="700" fill="#595959" text-anchor="middle">PAJO PATAK // LVL 4</text>
    <text x="84" y="166" font-size="9" font-weight="700" fill="#595959" text-anchor="middle">ABERRANT SORCERY</text>

    <rect x="36" y="190" width="96" height="22" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="84" y="205" font-size="10" font-weight="900" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">SHEET EDITOR</text>
  </g>

  <!-- ================= HORIZONTAL SIDEBAR HUD PREVIEW ROW ================= -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="920" height="90" rx="4" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2" filter="url(#chisel-drop)"/>

    <!-- Title indicator -->
    <text x="24" y="30" font-size="10" font-weight="900" fill="#f59e0b" letter-spacing="2">PERSISTENT SIDEBAR NAVIGATION // LIVE INTEGRATION PREVIEW</text>
    <text x="24" y="48" font-size="11" font-weight="700" fill="#eae2d5">64×64 Keycaps scaled to 36×36 inline buttons for Left Navigation Rails &amp; HUD headers</text>
    <text x="24" y="68" font-size="9" font-family="'JetBrains Mono', monospace" fill="#8c8c8c">SPEC: Unified 2.5px solid black border, dual-chisel relief, Space Grotesk labels</text>

    <!-- Mini Navigation Strip Preview (Windows 95 / Bauhaus HUD) -->
    <!-- Item 1: Cast & Combat (Active) -->
    <g transform="translate(490, 18)">
      <rect x="0" y="0" width="76" height="54" rx="3" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="2" y="2" width="72" height="50" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <!-- mini bolt -->
      <polygon points="18,14 10,28 16,28 13,38 24,24 18,24" fill="#1a1a1a"/>
      <text x="44" y="27" font-size="8" font-weight="900" fill="#1a1a1a">CAST</text>
      <text x="44" y="38" font-size="7" font-weight="800" fill="#1a1a1a">&amp; COMBAT</text>
    </g>

    <!-- Item 2: Metamagic -->
    <g transform="translate(574, 18)">
      <rect x="0" y="0" width="76" height="54" rx="3" fill="#2e2e2e" stroke="#1a1a1a" stroke-width="1.5"/>
      <path d="M 18,14 Q 19,20 26,24 Q 19,28 18,34 Q 17,28 10,24 Q 17,20 18,14 Z" fill="#2563eb" stroke="#ffffff" stroke-width="1"/>
      <text x="44" y="33" font-size="8" font-weight="800" fill="#ffffff">META</text>
    </g>

    <!-- Item 3: Feats -->
    <g transform="translate(658, 18)">
      <rect x="0" y="0" width="76" height="54" rx="3" fill="#2e2e2e" stroke="#1a1a1a" stroke-width="1.5"/>
      <path d="M 18,14 L 26,19 L 26,29 C 26,34 18,38 18,38 C 18,38 10,34 10,29 L 10,19 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>
      <text x="44" y="33" font-size="8" font-weight="800" fill="#ffffff">FEATS</text>
    </g>

    <!-- Item 4: Library -->
    <g transform="translate(742, 18)">
      <rect x="0" y="0" width="76" height="54" rx="3" fill="#2e2e2e" stroke="#1a1a1a" stroke-width="1.5"/>
      <rect x="12" y="16" width="4" height="20" fill="#2563eb"/>
      <rect x="18" y="14" width="4" height="22" fill="#f59e0b"/>
      <rect x="24" y="17" width="4" height="19" fill="#dc2626"/>
      <text x="44" y="33" font-size="8" font-weight="800" fill="#ffffff">SPELLS</text>
    </g>

    <!-- Item 5: Character -->
    <g transform="translate(826, 18)">
      <rect x="0" y="0" width="76" height="54" rx="3" fill="#2e2e2e" stroke="#1a1a1a" stroke-width="1.5"/>
      <circle cx="18" cy="20" r="5" fill="#eae2d5"/>
      <path d="M 10,35 C 10,28 14,26 18,26 C 22,26 26,28 26,35 Z" fill="#eae2d5"/>
      <text x="44" y="33" font-size="8" font-weight="800" fill="#ffffff">CHAR</text>
    </g>
  </g>

  <!-- Bottom Legend & Usage Note -->
  <g transform="translate(40, 458)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#595959" letter-spacing="1">BORDER SPEC: 64×64 TACTILE KEYCAP // UNIFIED 2.5PX SOLID BLACK BORDER + DUAL-BEVEL INSET + CORNER RIVETS</text>
  </g>
</svg>