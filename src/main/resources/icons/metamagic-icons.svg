<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" style="background:#f4ede2; font-family:'Space Grotesk', 'JetBrains Mono', monospace;">
  <defs>
    <!-- Brutalist tactile drop shadow filter -->
    <filter id="chisel-drop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#1a1a1a" />
    </filter>
  </defs>

  <!-- Title / Spec Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="8" height="24" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2"/>
    <text x="18" y="18" font-size="16" font-weight="900" fill="#1a1a1a" letter-spacing="2">D&amp;D 2024 METAMAGIC // TACTILE BAUHAUS ICON SUITE</text>
    <text x="760" y="18" font-size="12" font-weight="700" fill="#595959" letter-spacing="1">10 ICONS // 72×72 KEYCAP GRID</text>
    <line x1="0" y1="32" x2="920" y2="32" stroke="#1a1a1a" stroke-width="2"/>
  </g>

  <!-- ================= ROW 1 (5 ICONS) ================= -->

  <!-- 1. CAREFUL SPELL -->
  <!-- Concept: Protective shield / sanctuary dome sheltering an ally point -->
  <g transform="translate(60, 95)">
    <!-- Tactile keycap frame -->
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <!-- Yellow top bar hallmark -->
    <rect x="0" y="0" width="140" height="24" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="70" y="16" font-size="10" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">CAREFUL</text>
    <!-- Icon Glyph Area (Centered at 70, 78) -->
    <g transform="translate(70, 80)">
      <!-- Bauhaus Aegis Shield with sheltered core dot -->
      <path d="M 0,-34 L 28,-18 L 28,12 C 28,26 0,36 0,36 C 0,36 -28,26 -28,12 L -28,-18 Z" fill="#eae2d5" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
      <!-- Inner protected chevron -->
      <path d="M 0,-24 L 18,-12 L 18,10 C 18,20 0,28 0,28 C 0,28 -18,20 -18,10 L -18,-12 Z" fill="#2563eb" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="0" cy="6" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
    </g>
    <!-- Cost tag -->
    <rect x="100" y="116" width="32" height="16" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="116" y="128" font-size="9" font-weight="800" fill="#1a1a1a" text-anchor="middle">1 SP</text>
  </g>

  <!-- 2. DISTANT SPELL -->
  <!-- Concept: Expanding range rings, arrow projectile extending distance -->
  <g transform="translate(245, 95)">
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="140" height="24" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="70" y="16" font-size="10" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">DISTANT</text>
    <g transform="translate(70, 80)">
      <!-- Expanding concentric radar arcs -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4 3"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#2563eb" stroke-width="2"/>
      <circle cx="0" cy="0" r="12" fill="#eae2d5" stroke="#1a1a1a" stroke-width="2"/>
      <!-- Diagonal piercing arrow/vector extending beyond boundaries -->
      <line x1="-24" y1="24" x2="26" y2="-26" stroke="#1a1a1a" stroke-width="4" stroke-linecap="square"/>
      <polygon points="28,-36 34,-18 18,-24" fill="#dc2626" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="-16" cy="16" r="4" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2"/>
    </g>
    <rect x="100" y="116" width="32" height="16" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="116" y="128" font-size="9" font-weight="800" fill="#1a1a1a" text-anchor="middle">1 SP</text>
  </g>

  <!-- 3. EMPOWERED SPELL -->
  <!-- Concept: Rerolling damage dice, upward power surge burst -->
  <g transform="translate(430, 95)">
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="140" height="24" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="70" y="16" font-size="10" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">EMPOWERED</text>
    <g transform="translate(70, 80)">
      <!-- Isometric damage die burst (faceted d6/d8) -->
      <polygon points="0,-32 26,-16 26,16 0,32 -26,16 -26,-16" fill="#eae2d5" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="0,-32 26,-16 0,0 -26,-16" fill="#fbbf24" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="0,0 26,-16 26,16 0,32" fill="#dc2626" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="0,0 -26,-16 -26,16 0,32" fill="#b45309" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
      <!-- Kinetic surge sparks -->
      <polygon points="0,-18 5,-8 15,-8 7,-2 10,8 0,2 -10,8 -7,-2 -15,-8 -5,-8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    </g>
    <rect x="100" y="116" width="32" height="16" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="116" y="128" font-size="9" font-weight="800" fill="#1a1a1a" text-anchor="middle">1 SP</text>
  </g>

  <!-- 4. EXTENDED SPELL -->
  <!-- Concept: Sandglass / hourglass time manipulation & enduring loop -->
  <g transform="translate(615, 95)">
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="140" height="24" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="70" y="16" font-size="10" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">EXTENDED</text>
    <g transform="translate(70, 80)">
      <!-- Geometric Hourglass / Double Time Pyramids -->
      <polygon points="-24,-28 24,-28 0,0" fill="#2563eb" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="-24,28 24,28 0,0" fill="#eae2d5" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
      <line x1="-28" y1="-28" x2="28" y2="-28" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="square"/>
      <line x1="-28" y1="28" x2="28" y2="28" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="square"/>
      <!-- Flowing Sand Stream & multiplier badge -->
      <line x1="0" y1="-4" x2="0" y2="18" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="22" r="3" fill="#f59e0b"/>
      <!-- "2X" duration glyph -->
      <rect x="14" y="-8" width="18" height="16" rx="2" fill="#1a1a1a"/>
      <text x="23" y="4" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">2×</text>
    </g>
    <rect x="100" y="116" width="32" height="16" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="116" y="128" font-size="9" font-weight="800" fill="#1a1a1a" text-anchor="middle">1 SP</text>
  </g>

  <!-- 5. HEIGHTENED SPELL (2 SP) -->
  <!-- Concept: Crushing disadvantage eye / intense focused mental beam -->
  <g transform="translate(800, 95)">
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="140" height="24" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="70" y="16" font-size="10" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">HEIGHTENED</text>
    <g transform="translate(70, 80)">
      <!-- Outer diamond prism -->
      <polygon points="0,-34 32,0 0,34 -32,0" fill="#eae2d5" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
      <!-- Piercing Arcane Eye pupil (Disadvantage focus) -->
      <path d="M -26,0 C -14,-16 14,-16 26,0 C 14,16 -14,16 -26,0 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="10" fill="#dc2626" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#1a1a1a"/>
      <!-- Downward crushing force chevrons -->
      <path d="M -8,-24 L 0,-16 L 8,-24" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
      <path d="M -8,24 L 0,16 L 8,24" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Red highlight for 2 SP -->
    <rect x="100" y="116" width="32" height="16" rx="2" fill="#dc2626" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="116" y="128" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">2 SP</text>
  </g>

  <!-- ================= ROW 2 (5 ICONS) ================= -->

  <!-- 6. QUICKENED SPELL (2 SP) -->
  <!-- Concept: Lightning bolt / velocity acceleration converting Action to Bonus Action -->
  <g transform="translate(60, 265)">
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="140" height="24" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="70" y="16" font-size="10" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">QUICKENED</text>
    <g transform="translate(70, 80)">
      <!-- High-voltage Bauhaus Lightning Bolt -->
      <polygon points="4,-34 -20,2 -2,2 -8,34 22,-2 2,-2" fill="#fbbf24" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
      <!-- Kinetic speed trail lines -->
      <line x1="-24" y1="-20" x2="-10" y2="-20" stroke="#dc2626" stroke-width="3" stroke-linecap="square"/>
      <line x1="-28" y1="-8" x2="-18" y2="-8" stroke="#dc2626" stroke-width="3" stroke-linecap="square"/>
      <line x1="12" y1="16" x2="26" y2="16" stroke="#dc2626" stroke-width="3" stroke-linecap="square"/>
      <line x1="16" y1="26" x2="28" y2="26" stroke="#dc2626" stroke-width="3" stroke-linecap="square"/>
    </g>
    <rect x="100" y="116" width="32" height="16" rx="2" fill="#dc2626" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="116" y="128" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">2 SP</text>
  </g>

  <!-- 7. SEEKING SPELL -->
  <!-- Concept: Guided tracking reticle / homing trajectory curving into target after miss -->
  <g transform="translate(245, 265)">
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="140" height="24" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="70" y="16" font-size="10" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">SEEKING</text>
    <g transform="translate(70, 80)">
      <!-- Precision target crosshairs -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#2563eb" stroke-width="2"/>
      <line x1="-34" y1="0" x2="34" y2="0" stroke="#1a1a1a" stroke-width="2.5"/>
      <line x1="0" y1="-34" x2="0" y2="34" stroke="#1a1a1a" stroke-width="2.5"/>
      <!-- Homing projectile curve trajectory -->
      <path d="M -22,24 Q 0,0 18,-18" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="3 3"/>
      <!-- Bullseye core -->
      <circle cx="0" cy="0" r="6" fill="#dc2626" stroke="#1a1a1a" stroke-width="2"/>
    </g>
    <rect x="100" y="116" width="32" height="16" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="116" y="128" font-size="9" font-weight="800" fill="#1a1a1a" text-anchor="middle">1 SP</text>
  </g>

  <!-- 8. SUBTLE SPELL -->
  <!-- Concept: Silent masked face / soundwave muted / hidden verbal & somatic seal -->
  <g transform="translate(430, 265)">
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="140" height="24" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="70" y="16" font-size="10" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">SUBTLE</text>
    <g transform="translate(70, 80)">
      <!-- Cryptic masquerade visor / covert silhouette -->
      <circle cx="0" cy="0" r="28" fill="#eae2d5" stroke="#1a1a1a" stroke-width="3"/>
      <!-- Soundwave mute bar (diagonal counterspell immunity strike) -->
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="#dc2626" stroke-width="4" stroke-linecap="square"/>
      <!-- Whispering lip silence seal / Keyhole hidden core -->
      <path d="M -16,4 C -8,-6 8,-6 16,4" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-8" cy="-8" r="3" fill="#2563eb" stroke="#1a1a1a" stroke-width="1.5"/>
      <circle cx="8" cy="-8" r="3" fill="#2563eb" stroke="#1a1a1a" stroke-width="1.5"/>
      <!-- Silence dot badge -->
      <rect x="-10" y="14" width="20" height="8" rx="2" fill="#1a1a1a"/>
    </g>
    <rect x="100" y="116" width="32" height="16" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="116" y="128" font-size="9" font-weight="800" fill="#1a1a1a" text-anchor="middle">1 SP</text>
  </g>

  <!-- 9. TRANSMUTED SPELL -->
  <!-- Concept: Elemental cycle matrix (Flame / Ice / Acid / Lightning / Thunder interchange) -->
  <g transform="translate(615, 265)">
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="140" height="24" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="70" y="16" font-size="10" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">TRANSMUTED</text>
    <g transform="translate(70, 80)">
      <!-- Tri-element rotating cyclic arrows (Alchemy transmutation) -->
      <!-- Flame droplet (Vermillion) -->
      <path d="M 0,-28 C 8,-16 12,-6 12,2 C 12,9 6,14 0,14 C -6,14 -12,9 -12,2 C -12,-6 -8,-16 0,-28 Z" fill="#dc2626" stroke="#1a1a1a" stroke-width="2.5"/>
      <!-- Frost / Lightning crystal shard (Cobalt) -->
      <polygon points="18,-4 28,12 12,18" fill="#2563eb" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
      <!-- Acid droplet (Yellow/Ochre) -->
      <circle cx="-16" cy="12" r="8" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2"/>
      <!-- Transmutation cycle circular arrow -->
      <path d="M -22,-6 A 26 26 0 0 1 24,-6" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="3 3"/>
      <polygon points="26,-12 28,0 18,-4" fill="#1a1a1a"/>
    </g>
    <rect x="100" y="116" width="32" height="16" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="116" y="128" font-size="9" font-weight="800" fill="#1a1a1a" text-anchor="middle">1 SP</text>
  </g>

  <!-- 10. TWINNED SPELL -->
  <!-- Concept: Twin paired beams dividing from a single origin, dual target strike -->
  <g transform="translate(800, 265)">
    <rect x="0" y="0" width="140" height="140" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="3" filter="url(#chisel-drop)" />
    <rect x="0" y="0" width="140" height="24" rx="2" fill="#f59e0b" stroke="#1a1a1a" stroke-width="2" />
    <text x="70" y="16" font-size="10" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="1">TWINNED</text>
    <g transform="translate(70, 80)">
      <!-- Origin Cast Node -->
      <circle cx="0" cy="22" r="7" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="0" cy="22" r="3" fill="#ffffff"/>
      <!-- Bifurcated V-shaped twin rays splitting to 2 target orbs -->
      <line x1="0" y1="16" x2="-20" y2="-16" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="0" y1="16" x2="20" y2="-16" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Twin Target Orbs (Dual Targets) -->
      <circle cx="-20" cy="-20" r="10" fill="#2563eb" stroke="#1a1a1a" stroke-width="2.5"/>
      <circle cx="-20" cy="-20" r="4" fill="#ffffff"/>
      <circle cx="20" cy="-20" r="10" fill="#2563eb" stroke="#1a1a1a" stroke-width="2.5"/>
      <circle cx="20" cy="-20" r="4" fill="#ffffff"/>
      <!-- Synchronized weave connector line -->
      <line x1="-10" y1="-20" x2="10" y2="-20" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 2"/>
    </g>
    <rect x="100" y="116" width="32" height="16" rx="2" fill="#eae2d5" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="116" y="128" font-size="9" font-weight="800" fill="#1a1a1a" text-anchor="middle">1 SP</text>
  </g>

  <!-- Bottom Legend & Usage Note -->
  <g transform="translate(40, 430)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#595959" letter-spacing="1">CANVAS ASSET // READY TO EMBED IN CARD HEADERS, HUD BUTTONS, OR TOOLTIPS</text>
  </g>
</svg>